<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Blocked — MIND OS Guardian</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --bg: #05040a;
      --bg-card: #0e0817;
      --purple: #a855f7;
      --gold: #f59e0b;
      --danger: #ef4444;
      --green: #22c55e;
      --text: #f4f4ff;
      --dim: #d97706;
      --border: #8b0000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(139, 0, 0, 0.35) 0%, rgba(45, 10, 70, 0.5) 45%, #05040a 85%);
      color: var(--text);
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      position: relative;
    }

    /* CRT Scanline Overlay */
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
      opacity: 0.5;
    }

    .pixel-text {
      font-family: 'Press Start 2P', monospace;
      letter-spacing: 0.04em;
    }

    .card {
      text-align: center;
      max-width: 580px;
      width: 100%;
      background: var(--bg-card);
      border: 3px solid var(--border);
      outline: 2px solid var(--gold);
      outline-offset: -5px;
      border-radius: 4px;
      padding: 40px 32px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.9), 0 0 30px rgba(139, 0, 0, 0.5);
      position: relative;
      z-index: 20;
      animation: cardAppear 0.4s ease-out;
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Sprite & Pedestal */
    .sprite-wrapper {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: #12081d;
      border: 3px solid var(--gold);
      box-shadow: 0 0 0 3px var(--border), 0 0 30px rgba(245, 158, 11, 0.4);
      border-radius: 4px;
      animation: spriteFloat 3.5s ease-in-out infinite alternate;
    }
    @keyframes spriteFloat {
      0%   { transform: translateY(0px);   filter: drop-shadow(0 0 15px rgba(168,85,247,0.5)); }
      100% { transform: translateY(-10px); filter: drop-shadow(0 0 30px rgba(245,158,11,0.8)); }
    }
    .sprite-img {
      width: 150px;
      height: 150px;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      user-select: none;
      z-index: 2;
      position: relative;
    }
    .sprite-pedestal {
      position: absolute;
      bottom: 8px;
      width: 130px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(168,85,247,0.7) 0%, rgba(245,158,11,0.3) 60%, transparent 80%);
      border: 1px solid rgba(245,158,11,0.5);
      box-shadow: 0 0 22px rgba(168,85,247,0.6);
      animation: pedestalPulse 2s ease-in-out infinite alternate;
    }
    @keyframes pedestalPulse {
      0%   { transform: scale(0.92); opacity: 0.7; }
      100% { transform: scale(1.1);  opacity: 1; }
    }

    .header-badge {
      font-size: 11px;
      color: #e9d5ff;
      background: #180924;
      border: 2px solid var(--purple);
      padding: 8px 16px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 18px;
      text-transform: uppercase;
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.4);
      text-shadow: 1px 1px 0 #000;
    }

    h1 {
      font-size: 18px;
      color: #ffffff;
      margin-bottom: 12px;
      line-height: 1.4;
      text-shadow: 2px 2px 0 #000, 0 0 12px rgba(239, 68, 68, 0.6);
    }

    .domain-box {
      background: #0c0814;
      border: 2px solid var(--border);
      border-radius: 4px;
      padding: 10px 18px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .domain-icon { font-size: 16px; }
    .domain-name {
      font-size: 15px;
      color: var(--purple);
      text-shadow: 0 0 10px rgba(168,85,247,0.8), 1px 1px 0 #000;
    }

    /* Quote box */
    .quote-box {
      font-size: 11px;
      color: #f3e8ff;
      line-height: 1.8;
      background: rgba(15, 7, 26, 0.92);
      border: 3px solid var(--border);
      border-left: 6px solid var(--gold);
      border-radius: 4px;
      padding: 18px 22px;
      margin-bottom: 24px;
      text-align: center;
      text-shadow: 1px 1px 0 #000;
    }
    .quote-author {
      display: block;
      font-size: 9px;
      color: var(--gold);
      margin-top: 10px;
      text-align: center;
    }

    /* Price & Balance Banner */
    .rule-card {
      background: rgba(14, 8, 24, 0.95);
      border: 3px solid var(--gold);
      border-radius: 4px;
      padding: 18px 24px;
      margin-bottom: 24px;
      box-shadow: inset 0 0 20px rgba(245, 158, 11, 0.15);
    }
    .rule-title {
      font-size: 10px;
      color: var(--gold);
      margin-bottom: 12px;
      text-transform: uppercase;
      text-shadow: 1px 1px 0 #000;
    }
    .rule-details {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 10px;
    }
    .rule-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .rule-val {
      font-size: 24px;
      color: #ffffff;
      text-shadow: 2px 2px 0 #000, 0 0 12px rgba(245,158,11,0.8);
    }
    .rule-lbl {
      font-size: 10px;
      color: var(--dim);
      text-shadow: 1px 1px 0 #000;
    }

    /* Actions */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 18px 24px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-shadow: 1px 1px 0 #000;
    }

    .btn-unlock {
      background: linear-gradient(180deg, #b45309 0%, #78350f 100%);
      border: 3px solid var(--gold);
      color: #ffffff;
      box-shadow: 0 0 0 2px #451a03, 0 0 28px rgba(245,158,11,0.6);
      text-transform: uppercase;
    }
    .btn-unlock:hover:not(:disabled) {
      background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%);
      transform: scale(1.02);
      box-shadow: 0 0 0 2px #451a03, 0 0 45px rgba(245,158,11,1);
    }
    .btn-unlock:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-back {
      background: #12091c;
      color: #d8b4fe;
      border: 2px solid var(--purple);
    }
    .btn-back:hover {
      background: var(--purple);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(168,85,247,0.7);
    }

    .status-msg {
      font-size: 11px;
      margin-top: 14px;
      min-height: 22px;
      text-shadow: 1px 1px 0 #000;
    }
    .status-msg.error { color: var(--danger); }
    .status-msg.success { color: var(--green); }

    .shake {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
      40%, 60% { transform: translate3d(7px, 0, 0); }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="header-badge pixel-text">🛡️ MIND OS GUARDIAN</div>
    
    <div class="sprite-wrapper">
      <img src="pixel_wizard_guardian.png" alt="Beatrix" class="sprite-img" />
      <div class="sprite-pedestal"></div>
    </div>

    <h1 class="pixel-text">ACCESS RESTRICTED</h1>

    <div class="domain-box">
      <span class="domain-icon">🌐</span>
      <span class="domain-name" id="blockedDomain">loading...</span>
    </div>

    <div class="quote-box">
      <p id="quoteText">"The Void claims those who succumb to distraction. Stay focused, Adventurer!"</p>
      <span class="quote-author" id="quoteAuthor">— BEATRIX (MIND OS GUARDIAN)</span>
    </div>

    <div class="rule-card" id="ruleCard">
      <div class="rule-title pixel-text">TEMPORARY PASS UNLOCK</div>
      <div class="rule-details">
        <div class="rule-item">
          <span class="rule-val pixel-text" id="userGoldVal">—</span>
          <span class="rule-lbl">🪙 YOUR GOLD</span>
        </div>
        <div style="font-size: 18px; color: var(--dim);">•</div>
        <div class="rule-item">
          <span class="rule-val pixel-text" id="unlockCostVal">100</span>
          <span class="rule-lbl">💸 UNLOCK COST</span>
        </div>
        <div style="font-size: 18px; color: var(--dim);">•</div>
        <div class="rule-item">
          <span class="rule-val pixel-text" id="unlockDurationVal">30m</span>
          <span class="rule-lbl">⏱ DURATION</span>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-unlock pixel-text" id="unlockBtn">
        🔓 UNLOCK (<span id="btnCost">100</span> 🪙)
      </button>
      <button class="btn btn-back pixel-text" id="backBtn">
        🛡️ RETURN TO WORK
      </button>
    </div>

    <p class="status-msg" id="statusMsg"></p>
  </div>

  <script>
    const QUOTES = [
      { text: "The Void claims those who succumb to distraction. Stay focused, Adventurer!", author: "Beatrix" },
      { text: "Is scrolling worth losing your hard-earned daily streak?", author: "Chronomancer" },
      { text: "Distractions are temporary. XP and Gold are eternal.", author: "MIND OS Codex" },
      { text: "Your companions are waiting for your return to the battlefield!", author: "Party Leader" },
      { text: "A true master governs their attention, not their impulses.", author: "Grandmaster" },
    ];

    async function init() {
      // Pick random quote
      const q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
      document.getElementById('quoteText').textContent = `"${q.text}"`;
      document.getElementById('quoteAuthor').textContent = `— ${q.author}`;

      // Get domain from URL param or referrer
      const params = new URLSearchParams(window.location.search);
      let domain = params.get('domain');
      if (!domain) {
        try { domain = new URL(document.referrer).hostname.replace(/^www\./, ''); } catch {}
      }

      // Load state from local storage
      const { gold, blockedSites = [] } = await browser.storage.local.get(['gold', 'blockedSites']);
      if (gold !== undefined) {
        document.getElementById('userGoldVal').textContent = gold.toLocaleString();
      }

      if (!domain || domain === 'null' || domain === 'blocked-site') {
        const siteMatch = (blockedSites || [])[0];
        domain = siteMatch ? siteMatch.domain : 'blocked-site';
      }
      document.getElementById('blockedDomain').textContent = domain;

      const site = (blockedSites || []).find((s) => s.domain.toLowerCase().trim().replace(/^www\./, '') === domain.toLowerCase().trim().replace(/^www\./, ''));
      const cost = site ? site.unlock_cost : 100;
      const duration = site ? site.unlock_duration_minutes : 30;

      document.getElementById('unlockCostVal').textContent = cost;
      document.getElementById('unlockDurationVal').textContent = duration;
      document.getElementById('btnCost').textContent = cost;

      // Unlock button handler
      const unlockBtn = document.getElementById('unlockBtn');
      const statusMsg = document.getElementById('statusMsg');
      const card = document.getElementById('card');

      unlockBtn.addEventListener('click', async () => {
        unlockBtn.disabled = true;
        unlockBtn.textContent = 'PROCESSING...';
        statusMsg.className = 'status-msg';
        statusMsg.textContent = '';

        try {
          const res = await browser.runtime.sendMessage({ type: 'UNLOCK_SITE', domain });
          if (res.ok) {
            statusMsg.className = 'status-msg success';
            statusMsg.textContent = '✓ UNLOCKED! RETURNING IN 3...';
            document.getElementById('userGoldVal').textContent = res.gold.toLocaleString();

            let cnt = 3;
            const timer = setInterval(() => {
              cnt--;
              if (cnt > 0) {
                statusMsg.textContent = `✓ UNLOCKED! RETURNING IN ${cnt}...`;
              } else {
                clearInterval(timer);
                window.location.href = 'https://' + domain;
              }
            }, 700);
          } else {
            unlockBtn.disabled = false;
            unlockBtn.innerHTML = `🔓 UNLOCK (<span id="btnCost">${cost}</span> 🪙)`;
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 400);

            statusMsg.className = 'status-msg error';
            if (res.error === 'insufficient_gold') {
              statusMsg.textContent = `Not enough gold! You have ${res.gold ?? 0} 🪙`;
            } else {
              statusMsg.textContent = 'Unlock failed. Check connection.';
            }
          }
        } catch (e) {
          console.error('Unlock error:', e);
          unlockBtn.disabled = false;
          unlockBtn.innerHTML = `🔓 UNLOCK (${cost} 🪙)`;
          statusMsg.className = 'status-msg error';
          statusMsg.textContent = 'Network error. Try again.';
        }
      });

      // Back button handler
      document.getElementById('backBtn').addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = 'https://mind-os-d5sk.onrender.com';
        }
      });
    }

    init();
  </script>
</body>
</html>
